[project]
name = "doclib"
readme = "README.md"
version = "0.1.0"
description = "Document Library: indexes shared drives in place and serves hybrid search over REST and MCP."
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30",            # Apache-2.0 (psycopg is LGPL, not allowed by spec section 17)
  "fastapi>=0.115",           # MIT
  "httpx>=0.27",              # BSD-3
  "mcp>=1.12,<2",             # MIT; 2.x renamed FastMCP
  "opentelemetry-api>=1.27",  # Apache-2.0
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "pydantic>=2.8",            # MIT
  "pyjwt>=2.9",               # MIT
  "pypdfium2>=5,<6",          # Apache-2.0 / BSD-3
  "pyyaml>=6",                # MIT
  "uvicorn>=0.30",            # BSD-3
  "xberg==1.3.9",             # MIT; pinned, swap behind doclib.extract.adapter
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "reportlab>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "pillow>=10"]

[project.scripts]
doclib = "doclib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doclib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Postgres (DOCLIB_TEST_DSN) and rclone", "samba: needs the Samba container (DOCLIB_TEST_SMB_REMOTE)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC220", "PLW1510", "PYI034"]
