# Deployment using any Postgres 16+ with pgvector. Point the DSN files at it:
#   secrets/admin_dsn   schema owner, used only by `migrate`
#   secrets/worker_dsn  read-write role
#   secrets/api_dsn     read-only role
#
# Existing cluster (a DBA runs postgres/existing-cluster.sql once, then you write the three DSN files):
#   docker compose -f deploy/docker-compose.yml up -d
# Bundled Postgres, for small sites (scripts/make-secrets.sh writes everything):
#   docker compose -f deploy/docker-compose.yml -f deploy/compose.postgres.yml up -d
# With a local CPU vision model, also add:  -f deploy/compose.vision.yml
#
# Connector credentials: put DOCLIB_CRED_* variables in secrets/connectors.env. Every doclib process gets the same set.
name: doclib
x-doclib: &doclib
  image: doclib:0.1.0
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp", "/home/doclib"]
  env_file:
    - {path: ./secrets/connectors.env, required: false}
  volumes:
    - ./config.compose.yaml:/etc/doclib/config.yaml:ro
    - ${DOCLIB_SHARE:-../examples/sample-docs}:/data/share:ro
  environment: &doclib-env
    DOCLIB_CONFIG: /etc/doclib/config.yaml
    DOCLIB_POSTGRES__DSN_FILE: /run/secrets/doclib_worker_dsn
    # Any OpenAI-compatible embedding service. compose.embed.yml adds our own at this default address.
    DOCLIB_EMBEDDINGS__ENDPOINT: ${DOCLIB_EMBEDDINGS_URL:-http://embed:8080/v1}

services:
  migrate:
    <<: *doclib
    restart: "no"
    command: ["migrate"]
    env_file: []
    environment:
      <<: *doclib-env
      DOCLIB_POSTGRES__DSN_FILE: /run/secrets/doclib_admin_dsn
    secrets: [doclib_admin_dsn]

  scanner:
    <<: *doclib
    command: ["scanner"]
    secrets: [doclib_worker_dsn]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *doclib
    command: ["worker"]
    secrets: [doclib_worker_dsn]
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    # Agent-facing: read-only role. The API gateway sits in front of this port.
    <<: *doclib
    command: ["api"]
    environment:
      <<: *doclib-env
      DOCLIB_POSTGRES__DSN_FILE: /run/secrets/doclib_api_dsn
    secrets: [doclib_api_dsn]
    ports: ["127.0.0.1:8080:8080"]  # Localhost only, because auth defaults to off. See "Before production" in the README.
    depends_on:
      migrate: {condition: service_completed_successfully}

  admin:
    # Connector management for other services. Published on localhost only: never make it reachable by agents.
    <<: *doclib
    command: ["admin-api"]
    secrets: [doclib_worker_dsn]
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8081:8081"]  # Service-to-service only. Never expose this to agents.

secrets:
  doclib_admin_dsn: {file: ./secrets/admin_dsn}
  doclib_worker_dsn: {file: ./secrets/worker_dsn}
  doclib_api_dsn: {file: ./secrets/api_dsn}
