apiVersion: v1
kind: ConfigMap
metadata:
  name: doclib-config
  annotations:
    # The migration job is a pre-install hook, so this must exist before it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
{{ toYaml .Values.config | indent 4 }}
