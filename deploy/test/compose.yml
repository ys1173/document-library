# Integration tests on an INTERNAL network: nothing here can reach the internet, which doubles as the air-gap test.
# Run: scripts/test-integration.sh
name: doclib-test
networks:
  airgap:
    internal: true
volumes:
  share:
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: doclib
    networks: [airgap]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  samba:
    build:
      context: .
      dockerfile: samba.Dockerfile
    networks: [airgap]
    volumes: ["share:/share:ro"]
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=64"]
    networks: [airgap]
    tmpfs: ["/data"]
    volumes: ["./seaweed-s3.json:/etc/seaweedfs/s3.json:ro"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 2s
      retries: 60
  tests:
    build:
      context: ../..
      dockerfile: deploy/test/Dockerfile
    networks: [airgap]
    depends_on:
      postgres: {condition: service_healthy}
      samba: {condition: service_started}
      seaweedfs: {condition: service_healthy}
    volumes:
      - ../../src:/src/src:ro
      - ../../tests:/src/tests:ro
      - ../../scripts:/src/scripts:ro
      - ../../deploy/postgres:/src/deploy/postgres:ro
      - ../../config.example.yaml:/src/config.example.yaml:ro
      - share:/smbshare
    environment:
      DOCLIB_TEST_DSN: postgresql://postgres:test@postgres:5432/doclib
      DOCLIB_TEST_SMB_HOST: samba
      DOCLIB_TEST_SMB_DIR: /smbshare
      DOCLIB_TEST_S3_ENDPOINT: http://seaweedfs:8333
      DOCLIB_TEST_S3_ACCESS_KEY: testaccess
      DOCLIB_TEST_S3_SECRET_KEY: testsecret
      DOCLIB_CRED_S3_ACCESS: testaccess
      DOCLIB_CRED_S3_SECRET: testsecret
      DOCLIB_TEST_AIRGAP: "1"
      HF_HUB_OFFLINE: "1"
    command: ["python", "-m", "pytest", "tests", "-q", "-p", "no:cacheprovider"]
